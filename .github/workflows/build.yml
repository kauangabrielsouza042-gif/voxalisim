name: Gerar Voxali.exe

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Baixar codigo do repositorio
      uses: actions/checkout@v4

    - name: Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: Instalar as dependencias do Electron
      run: npm install

    - name: Compilar o executavel Portable (.exe)
      run: npm run build

    - name: Disponibilizar o Voxali.exe para download
      uses: actions/upload-artifact@v4
      with:
        name: Voxali-Instalador
        path: dist/*.exe
